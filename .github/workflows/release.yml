name: release

on:
  push:
    tags: ['v*']
  # Same pipeline without publishing, for checking a change end to end.
  workflow_dispatch:

permissions:
  contents: write

env:
  # electron-builder's own cache; keyed separately from the pnpm store.
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  # GitHub-hosted runners have 7 GB of RAM, and Node sizes its default old space from that: about
  # 2 GB, against the ~4.3 GB a 16 GB laptop gets. So a renderer build that is comfortable locally
  # aborts here with "Ineffective mark-compacts near heap limit" and no other clue. Renderer
  # sourcemaps are off now, which brought the peak well under 2 GB on its own; this is the margin
  # so the next dependency that grows does not put us back at the cliff edge.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Gate the builds. A broken typecheck or a regressed patch builder must never ship.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No pnpm/action-setup: third-party actions are frequently blocked by enterprise Actions
      # policy, and corepack ships with Node and reads `packageManager` from package.json.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - name: Source control self-test
        run: pnpm run git:selftest

      - name: Split-tree self-test
        run: pnpm run panes:selftest

      - name: Build renderer, main and preload
        run: pnpm exec electron-vite build

  build:
    needs: check
    strategy:
      # One platform failing should not hide whether the others are fine.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-windows
            # electron-builder repackages prebuilt Electron binaries and node-pty ships prebuilds
            # for all six targets in one tarball, so nothing is compiled and Linux can emit the
            # Windows installer too. No wine needed for an unsigned NSIS build.
            targets: --linux --win
          - os: macos-latest
            name: macos
            # Must be macOS: dmg creation calls hdiutil and signing calls codesign, and neither
            # exists elsewhere.
            targets: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No pnpm/action-setup: third-party actions are frequently blocked by enterprise Actions
      # policy, and corepack ships with Node and reads `packageManager` from package.json.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec electron-vite build

      - name: Package ${{ matrix.name }}
        # --publish never: artifacts are collected and attached by the release job below, so a
        # partial matrix cannot leave a half-populated release behind.
        run: pnpm exec electron-builder ${{ matrix.targets }} --publish never

      # A packaged app that throws during module evaluation shows no window and logs nothing, so
      # only actually booting it catches that. Electron needs a display, so this is best-effort:
      # if the runner has no xvfb the gate is skipped rather than failing the build for the wrong
      # reason. It is reported either way so a silent skip cannot be mistaken for a pass.
      - name: Boot the packaged app
        run: |
          set -euo pipefail
          DIR="release/$(node -p "require('./package.json').version")"

          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Run the arch native to the runner; Rosetta may not be installed.
            APP="$DIR/mac-arm64/onestop.app"
            [ -d "$APP" ] || APP="$DIR/mac/onestop.app"
            echo "booting $APP"
            ONESTOP_SMOKE=1 "$APP/Contents/MacOS/onestop"
            exit 0
          fi

          APP="$DIR/linux-unpacked/onestop"
          if [ ! -x "$APP" ]; then echo "no linux-unpacked build to boot; skipping"; exit 0; fi
          if ! command -v xvfb-run >/dev/null; then
            echo "::warning::xvfb not present on this runner, cannot boot-test the packaged app"
            exit 0
          fi
          ONESTOP_SMOKE=1 xvfb-run -a "$APP" --no-sandbox

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: artifacts

      - run: ls -lhR artifacts

      # `gh` is preinstalled on every runner, so the release needs no third-party action either.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          cat > "$NOTES" <<'EOT'
          Builds are ad-hoc signed, not notarised, so the first launch needs one extra step:

          - **macOS** — right-click the app and choose *Open*, or
            `xattr -dr com.apple.quarantine /Applications/onestop.app`
          - **Windows** — SmartScreen: *More info → Run anyway*
          - **Linux** — `chmod +x` the AppImage
          EOT
          PRERELEASE=""
          case "${{ github.ref_name }}" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "$NOTES" \
            --generate-notes \
            $PRERELEASE \
            artifacts/*
