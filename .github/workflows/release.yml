name: release

on:
  push:
    tags: ['v*']
  # Same pipeline without publishing, for checking a change end to end.
  workflow_dispatch:

permissions:
  contents: write

env:
  # electron-builder's own cache; keyed separately from the pnpm store.
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  # GitHub-hosted runners have 7 GB of RAM, and Node sizes its default old space from that: about
  # 2 GB, against the ~4.3 GB a 16 GB laptop gets. So a renderer build that is comfortable locally
  # aborts here with "Ineffective mark-compacts near heap limit" and no other clue. Renderer
  # sourcemaps are off now, which brought the peak well under 2 GB on its own; this is the margin
  # so the next dependency that grows does not put us back at the cliff edge.
  NODE_OPTIONS: --max-old-space-size=4096

# Every `uses:` below is the current major of a first-party action, and every one of them
# declares `runs.using: node24`. The Node 20 runtime is deprecated and the runner was already
# force-upgrading these to Node 24 while warning about it, so this only makes explicit what was
# happening anyway.
#
# The version numbers disagree because each action's major track moves independently and the
# node24 cutover landed at a different point on each, so there is no single major to align them on.
#
# All of them require Actions Runner >= 2.327.1. That is automatic on GitHub-hosted runners but
# not on self-hosted ones — if this workflow ever moves back to a company runner label, check the
# agent version before assuming the failure is in the build.
jobs:
  # Gate the builds. A broken typecheck or a regressed patch builder must never ship.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No pnpm/action-setup: third-party actions are frequently blocked by enterprise Actions
      # policy, and corepack ships with Node and reads `packageManager` from package.json.
      # This must stay ABOVE setup-node: `cache: pnpm` shells out to `pnpm store path` to find
      # what to cache, and without pnpm on PATH the step dies with "Unable to locate executable
      # file: pnpm".
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every installer's name, and the version the app reports about itself, come from
      # package.json — not from the tag. v1.0.0 was tagged on a package.json still saying
      # 0.0.1-alpha.5, and every installer it built was named, and called itself, alpha.5.
      - name: The tag is the version package.json says
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != '${{ github.ref_name }}' ]; then
            echo "::error::tagged ${{ github.ref_name }}, but package.json says $VERSION: commit the version first, then tag that commit"
            exit 1
          fi

      - run: pnpm run typecheck

      - name: Source control self-test
        run: pnpm run git:selftest

      - name: Split-tree self-test
        run: pnpm run panes:selftest

      - name: Plugin install self-test
        run: pnpm run plugins:selftest

      - name: Build renderer, main and preload
        run: pnpm exec electron-vite build

      # Tag builds attach their installers straight onto this draft and the release job publishes
      # it, so nothing passes through Actions artifact storage. That storage is metered against the
      # org's quota even though this repository is public, and it accrues in GB-hours that deleting
      # artifacts does not give back: one tag's ~1.4 GB of installers, held for a 7-day retention,
      # is ~240 GB-hours, two thirds of a month on the free plan's 500 MB. v0.0.1-alpha.4 built,
      # packaged and booted on all three platforms and then died at upload-artifact with "Artifact
      # storage quota has been hit". Release assets have no quota.
      #
      # Opened here, once, before the matrix fans out: a draft is not bound to its tag until it is
      # published, so three legs each creating it would leave three drafts. Reused if it exists, so
      # a re-run can finish what an earlier attempt started, including a release it published.
      - name: Open a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; the builds will upload over it"
            exit 0
          fi
          NOTES=$(mktemp)
          cat > "$NOTES" <<'EOT'
          Builds are ad-hoc signed, not notarised, so the first launch needs one extra step:

          - **macOS** — right-click the app and choose *Open*, or
            `xattr -dr com.apple.quarantine /Applications/rigee.app`
          - **Windows** — SmartScreen: *More info → Run anyway*
          - **Linux** — `chmod +x` the AppImage
          EOT
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease";; esac
          # --verify-tag because a draft does not check its tag: publishing one whose tag is gone
          # would quietly cut a new tag from the default branch.
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$NOTES" \
            --generate-notes \
            $PRERELEASE


  build:
    needs: check
    strategy:
      # One platform failing should not hide whether the others are fine.
      fail-fast: false
      # Each platform is built on its own OS. Nothing here is compiled — electron-builder
      # repackages prebuilt Electron binaries and node-pty ships prebuilds for all six targets —
      # so cross-building looks like it should work, and for Linux from macOS or vice versa it
      # would. It is the packaging tools that are native, and each one fails differently.
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            targets: --linux
          - os: windows-latest
            name: windows
            # Must be Windows. Linux got as far as producing all three NSIS installers and then
            # died in finishBuild with `spawn wine ENOENT`, three times over: `signAndEditExecutable`
            # stamps the icon, version block and manifest into each finished installer with rcedit,
            # which is a Windows binary and needs wine everywhere else. Installing wine is the
            # other way out, but it is a slow and famously brittle dependency to have in a release
            # pipeline, and turning the flag off would ship an installer with a blank icon and no
            # version metadata.
            targets: --win
          - os: macos-latest
            name: macos
            # Must be macOS: dmg creation calls hdiutil and signing calls codesign, and neither
            # exists elsewhere.
            targets: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # No pnpm/action-setup: third-party actions are frequently blocked by enterprise Actions
      # policy, and corepack ships with Node and reads `packageManager` from package.json.
      # This must stay ABOVE setup-node: `cache: pnpm` shells out to `pnpm store path` to find
      # what to cache, and without pnpm on PATH the step dies with "Unable to locate executable
      # file: pnpm".
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec electron-vite build

      - name: Package ${{ matrix.name }}
        # --publish never: the installers go onto the draft release, which only the release job
        # below publishes, so a partial matrix cannot leave a half-populated release behind.
        run: pnpm exec electron-builder ${{ matrix.targets }} --publish never

      # A packaged app that throws during module evaluation shows no window and logs nothing, so
      # only actually booting it catches that. It is also the only step that loads node-pty's
      # native addon out of the unpacked asar, and that unpacking is exactly what differs between
      # the three platforms.
      #
      # The Linux leg is best-effort because Electron needs a display: with no xvfb the gate is
      # skipped rather than failing the build for the wrong reason. It says so either way, so a
      # silent skip cannot be mistaken for a pass.
      - name: Boot the packaged app
        # Git Bash on Windows, so one script covers all three runners.
        shell: bash
        # A window that never closes would otherwise hold the job for the full six hours.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          DIR="release/$(node -p "require('./package.json').version")"

          case "${{ runner.os }}" in
            macOS)
              # Boot the arch native to the runner; Rosetta may not be installed.
              APP="$DIR/mac-arm64/rigee.app"
              [ -d "$APP" ] || APP="$DIR/mac/rigee.app"
              BIN="$APP/Contents/MacOS/rigee"
              [ -x "$BIN" ] || { echo "no macOS build at $APP"; exit 1; }
              echo "booting $APP"
              RIGEE_SMOKE=1 "$BIN"
              ;;
            Windows)
              # x64 only: the arm64 installer is built here but cannot run on an x64 runner.
              BIN="$DIR/win-unpacked/rigee.exe"
              [ -f "$BIN" ] || { echo "no Windows build at $BIN"; exit 1; }
              echo "booting $BIN"
              RIGEE_SMOKE=1 "$BIN"
              ;;
            Linux)
              BIN="$DIR/linux-unpacked/rigee"
              [ -x "$BIN" ] || { echo "no Linux build at $BIN"; exit 1; }
              if ! command -v xvfb-run >/dev/null; then
                echo "::warning::xvfb not present on this runner, cannot boot-test the packaged app"
                exit 0
              fi
              echo "booting $BIN"
              RIGEE_SMOKE=1 xvfb-run -a "$BIN" --no-sandbox
              ;;
          esac

      # Onto the draft opened by `check`, not upload-artifact: see there for why. Tags only, since a
      # manual dispatch has no release to attach to. --clobber so a re-run leg replaces whatever its
      # first attempt managed to upload.
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(
            release/*/*.dmg release/*/*.zip release/*/*.exe
            release/*/*.AppImage release/*/*.deb release/*/latest*.yml
          )
          [ "${#FILES[@]}" -gt 0 ] || { echo "no installers under release/" >&2; exit 1; }
          printf 'attaching %d files:\n' "${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          gh release upload '${{ github.ref_name }}' "${FILES[@]}" --clobber

  # @rigee/plugin-api, to npm — when this tag carries a version of it npm does not have yet. Most
  # releases do not change the API, and those skip. Its own job, so that a refusal from npm can
  # never hold back the installers, and the reverse.
  #
  # Authenticated by npm's trusted publishing: npm trusts this workflow, on this repository, by its
  # OIDC identity, so no npm token is stored anywhere to leak. `--provenance` publishes a signed
  # statement of which commit and which run built the tarball, shown on the package's npm page.
  plugin-api:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm 11.5.1 or later; the npm bundled with Node may be older.
      - run: npm install -g npm@^11.5.1

      - name: Publish @rigee/plugin-api, if this version is new
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/plugin-api/package.json').version")
          if npm view "@rigee/plugin-api@$VERSION" version >/dev/null 2>&1; then
            echo "@rigee/plugin-api $VERSION is already on npm; nothing to publish"
            exit 0
          fi
          pnpm run pack:plugin-api
          npm publish "release/rigee-plugin-api-$VERSION.tgz" --provenance --access public

  # By now every leg has attached its installers to the draft. If any leg failed, this is skipped
  # and the release stays a draft, which only people with write access can see: re-run the failed
  # jobs to finish it, or `gh release delete <tag>` to abandon the tag.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # `gh` is preinstalled on every runner, so the release needs no third-party action either.
      #
      # GH_REPO is not optional here. This job deliberately skips actions/checkout — it only talks
      # to the API — and without a checkout `gh` has no git remote to infer the repository from,
      # so every subcommand dies with "fatal: not a git repository". Setting it is cheaper than
      # cloning the repo just to tell gh its own name.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          echo "publishing $TAG with:"
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)"'
          gh release edit "$TAG" --draft=false
