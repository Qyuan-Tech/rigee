name: release

on:
  push:
    tags: ['v*']
  # Same pipeline without publishing, for checking a change end to end.
  workflow_dispatch:

permissions:
  contents: write

env:
  # electron-builder's own cache; keyed separately from the pnpm store.
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  # Gate the builds. A broken typecheck or a regressed tmux parser should never reach a release.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No pnpm/action-setup: third-party actions are frequently blocked by enterprise Actions
      # policy, and corepack ships with Node and reads `packageManager` from package.json.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The tmux self-test drives a real tmux server (on a private socket).
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - name: tmux control-mode self-test
        run: pnpm run tmux:selftest

      - name: Build renderer, main and preload
        run: pnpm exec electron-vite build

  build:
    needs: check
    strategy:
      # One platform failing should not hide whether the others are fine.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-windows
            # electron-builder repackages prebuilt Electron binaries and node-pty ships prebuilds
            # for all six targets in one tarball, so nothing is compiled and Linux can emit the
            # Windows installer too. No wine needed for an unsigned NSIS build.
            targets: --linux --win
          - os: macos-latest
            name: macos
            # NOT ubuntu-latest: dmg creation needs hdiutil and signing needs codesign, and
            # neither exists off macOS. Delete this entry if you do not want Mac artifacts.
            targets: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No pnpm/action-setup: third-party actions are frequently blocked by enterprise Actions
      # policy, and corepack ships with Node and reads `packageManager` from package.json.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec electron-vite build

      - name: Package ${{ matrix.name }}
        # --publish never: artifacts are collected and attached by the release job below, so a
        # partial matrix cannot leave a half-populated release behind.
        run: pnpm exec electron-builder ${{ matrix.targets }} --publish never

      # A packaged app that throws during module evaluation shows no window and logs nothing,
      # so only actually booting it catches it. Needs a display on Linux.
      - name: Boot the packaged app
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          # Both arches are built; run the one native to the runner, since Rosetta may not be
          # present. macos-latest is arm64, which electron-builder puts in mac-arm64/.
          DIR="release/$(node -p "require('./package.json').version")"
          APP="$DIR/mac-arm64/onestop.app"
          [ -d "$APP" ] || APP="$DIR/mac/onestop.app"
          echo "booting $APP"
          ONESTOP_SMOKE=1 "$APP/Contents/MacOS/onestop"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: artifacts

      - run: ls -lhR artifacts

      # `gh` is preinstalled on every runner, so the release needs no third-party action either.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          cat > "$NOTES" <<'EOT'
          Builds are ad-hoc signed, not notarised, so the first launch needs one extra step:

          - **macOS** — right-click the app and choose *Open*, or
            `xattr -dr com.apple.quarantine /Applications/onestop.app`
          - **Windows** — SmartScreen: *More info → Run anyway*
          - **Linux** — `chmod +x` the AppImage

          Terminal tabs need `tmux` installed (via WSL2 on Windows).
          EOT
          PRERELEASE=""
          case "${{ github.ref_name }}" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "$NOTES" \
            --generate-notes \
            $PRERELEASE \
            artifacts/*
