appId: dev.onestop.app
productName: onestop
directories:
  output: release/${version}
  buildResources: build

files:
  - out/**/*
  - package.json
  # NO blanket '!node_modules/**/*' + allowlist. electron-builder already packs `dependencies`
  # and their transitive deps and nothing else, and hand-listing packages silently drops the
  # things they in turn require: @parcel/watcher needs picomatch, and without it the main process
  # threw during module evaluation and the app produced no output whatsoever — no window, no log,
  # nothing to debug. Prune inside the packages instead of choosing the packages.
  - '!node_modules/node-pty/{src,scripts,deps,third_party,typings}/**'
  # @electron/rebuild output is host-arch only and SHADOWS the correct prebuild
  # (node-pty resolves build/Release before prebuilds/). It poisons cross-packaging.
  - '!node_modules/node-pty/{build,bin}/**'
  - '!node_modules/node-pty/binding.gyp'
  - '!**/*.pdb'
  - '!**/*.map'

# .node files cannot be dlopen'd from inside an asar, and spawn-helper must be a real
# executable on disk. node-pty rewrites app.asar -> app.asar.unpacked itself.
asar: true
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/@parcel/watcher*/**'

extraMetadata:
  main: out/main/index.js

mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  darkModeSupport: true
  # Hardened runtime is a NOTARIZATION requirement, not a signing one, and combining it with an
  # ad-hoc signature is what stops the app launching through LaunchServices: run the binary
  # directly and it is fine, double-click it and it dies before main with only
  # `codesign_util.cc: task_name_for_pid` on stderr. Turn it on again together with a real
  # Developer ID and notarization.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc sign ("-") rather than leaving the bundle unsigned (null).
  #
  # An unsigned bundle runs when its binary is executed directly but is refused by Gatekeeper
  # when launched through LaunchServices, which is how anyone actually starts an app: it exits
  # instantly, with no window and nothing on stdout. Letting electron-builder do the signing is
  # what makes this correct — it signs the nested helper bundles in the right order, which a
  # post-hoc `codesign --deep` does not.
  identity: '-'
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: Terminal programs may access the microphone.
    NSCameraUsageDescription: Terminal programs may access the camera.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  deleteAppDataOnUninstall: false

linux:
  # A directory: electron-builder picks whichever size each target needs.
  icon: build/icons
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Development
  maintainer: onestop <dev@onestop.local>
  synopsis: Agentic IDE
  # Without this, desktop environments cannot associate running windows with the .desktop entry.
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: onestop

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

# node-pty is a Node-API addon shipping prebuilds for all six targets; rebuilding breaks things.
npmRebuild: false
# Works around an electron-builder 26.16.1 computeChannelNames TypeError.
publish: null
electronDownload:
  cache: .cache/electron
