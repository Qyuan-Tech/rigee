<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      'unsafe-inline' in style-src is required: Monaco and xterm.js both inject <style> elements.
      connect-src ws://localhost:* is required by the vite HMR client in dev.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws://localhost:*"
    />
    <title>Rigee</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
